<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Premium Royal Blue to Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6BFF" />
      <stop offset="100%" stop-color="#0A3BB3" />
    </linearGradient>

    <!-- 3D Isometric Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- AI Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadow for high-res crispness -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base Frame -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="1.5" filter="url(#glow)" />

  <!-- Digital Twin Wireframe Radar Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Isometric 3D Motor / Digital Twin Cube -->
  <!-- Top Face -->
  <polygon points="32,14 49,23.5 32,33 15,23.5" fill="url(#cubeTop)" stroke="#BFDBFE" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Left Face -->
  <polygon points="15,23.5 32,33 32,50 15,40.5" fill="url(#cubeLeft)" stroke="#60A5FA" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Right Face -->
  <polygon points="32,33 49,23.5 49,40.5 32,50" fill="url(#cubeRight)" stroke="#3B82F6" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Glowing AI Diamond / Nexus Core at Cube Center -->
  <polygon points="32,27 37,33 32,39 27,33" fill="url(#coreGlow)" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="32" cy="33" r="2" fill="#FFFFFF" />

  <!-- Data Node Markers (Sensors: DE, NDE, Stator, Power) -->
  <circle cx="49" cy="23.5" r="2.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="15" cy="23.5" r="2.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="32" cy="50" r="2.5" fill="#10B981" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="32" cy="14" r="2.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="0.8" />
</svg>